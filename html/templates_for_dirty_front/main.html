<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Гештальч!</title>
    </head>
    <body style="background-color: lightblue;">
        {{template "auth" .}}
        <h1>Cписок борд:</h1>
        {{range .Boards}}
        <a href="/old{{.Name}}"><b>{{.Name}}</b></a> - {{.Description}} | Постов: {{.PostsCount}} (всего {{.PostsCountWithResponses}})<br><br>
        {{end}}
        <form action="/old/create-board" method="post" target="cbr">
            <label for="name">Имя</label>
            <input type="text" id="name" name="Name">

            <label for="text">Описание</label>
            <input type="text" id="text" name="Description"></input>

            <button type="submit">Создать борду</button>
        </form>
        <iframe name="cbr"></iframe>
    </body>
</html>
