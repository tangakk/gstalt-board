<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Гештальч!</title>
		<!-- <link rel="stylesheet" href="/internal/style.css"> -->
		<link rel="stylesheet" href="style.css">
    </head>
    <body>
		<div class="title">
			<div class="flex1"></div>
			<div class="center text-center flex1"><h1>Гештальч!</h1></div>
			<div class="flex1 flex-row">
				<div class="flex1"></div>
				{{if .IsRegistred}}
				<div class="w250">
					<fieldset class="flex-row gap10 pad10">
						<legend>| Авторизован |</legend>
						<div class="text-center m-top flex-column justify gap5">
							<p>{{.Username}}</p>
							<details class="w150">
								<summary class="button flex-column">Редактировать</summary>
								<form class="space border shadow flex-column gap5 pad10" action="/api/edit-profile">
									<p>Никнейм</p>
									<input class="field" name="Name">
									<label for="change-avatar" class="button border shadow pad2 text-center">Выбрать Аватар</label>
									<input id="change-avatar" class="hidden" type="file" name="file">
									<input class="button" type="submit" value="Ввод">
								</form>
							</details>
							<a class="button" href="/api/logout">Выйти</a>
						</div>
						<img class="m-top milli-icon" src="{{.Avatar}}">
					</fieldset>
				</div>
				{{else}}
				<form class="w250" action="/api/login">
					<fieldset class="flex-column gap5 pad10">
						<legend>| Вход | Регистрация |</legend>
						<div class="center flex-column gap5 w150">
							<p>Логин</p>
							<input class="field" name="Name">
							<p>Пароль</p>
							<input class="field" type="password" name="Pass">
							<input class="button" type="submit" value="Ввод">
						</div>
					</fieldset>
				</form>
				{{end}}
			</div>
		</div>
		<div>
			{{range .Boards}}
			<div class="center flex-column gap5 w1000">
				<a href="{{.Path}}" class="button flex-row gap10 pad10">
					<img class="micro-icon" src="{{.Image}}">
					<div class="board-namedesc">
						<h2>{{.Name}}</h2>
						<h3 class="pre">{{.Desc}}</h3>
					</div>
				</a>
				{{if .IsSuperadmin}}
				<div class="flex-row gap10">
					<details>
						<summary class="button text-center w150 flex-column">Редактировать</summary>
						<form class="space border shadow flex-column gap5 pad10" action="/api/edit-profile">
							<p>Никнейм</p>
							<input class="field" name="Name">
							<label for="change-avatar" class="button border shadow pad2 text-center">Выбрать Аватар</label>
							<input id="change-avatar" class="hidden" type="file" name="file">
							<input class="button" type="submit" value="Ввод">
						</form>
					</details>
					<div class="button text-center w150">Удалить</div>
				</div>
				{{end}}
			</div>
			{{end}}
		</div>
		<div></div>
    </body>
</html>
