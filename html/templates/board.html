<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Гештальт</title>
		<link rel="stylesheet" href="/internal/style.css">
		<script src="/internal/script.js"></script>
    </head>
    <body>
		<div>
			<div class="center title">
			<a href="/">На главную страницу</a>
			<h1 id="board-title">/...</h1>
			</div>
			<div id="result" class="result reverse">
				<div class="border message">
					<img class="post-avatar" src="">
					<div>
						<div class="row">
							<h4 class="post-id">#0</h4>
							<h4 class="post-author">...</h4>
							<h4 class="post-time">00:00</h4>
						</div>
						<h2 class="post-text">...</h2>
					</div>
					<a class="post-reply button center" href="">Ответить</a>
				</div>
			</div>
			<form class="input" action="" method="post" enctype="multipart/form-data"
			target="result">
				<div>
					<label for="author">Автор</label>
					<input type="text" id="author" name="Author">
				</div>
				<div class="grow-4">
					<label for="text">Текст</label>
					<textarea id="text" name="Text"></textarea>
					<label for="data">Картинка</label>
					<input type="file" name="Data" id="data" accept="image/jpeg">
				</div>
				<div>
					<input type="hidden" name="Board" value="{{ .Board }}">
					<button class="button" type="submit">Отправить</button>
				</div>
			</form>
		</div>
    </body>
</html>
